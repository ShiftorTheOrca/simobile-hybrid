<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="full">
    <!-- Pengaturan Mode Gelap / Terang -->
    <ion-list-header>
      <ion-label>Tampilan</ion-label>
    </ion-list-header>
    <ion-item>
      <ion-icon name="moon" slot="start" color="primary"></ion-icon>
      <ion-toggle [(ngModel)]="isDarkMode" (ionChange)="toggleDarkMode()">Mode Gelap</ion-toggle>
    </ion-item>
  </ion-list>
</ion-content>

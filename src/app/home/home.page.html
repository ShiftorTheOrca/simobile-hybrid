<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title size="large">Home</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-item>
    <ion-card color="primary">
      <ion-card-header>
        <ion-card-title>Jumlah Produk:</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <h2>{{totalProduk}}</h2>
      </ion-card-content>
    </ion-card>

    <ion-card color="secondary">
      <ion-card-header>
        <ion-card-title>Total transaksi hari ini:</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <h2>{{totalTransaksiToday}}</h2>
      </ion-card-content>
    </ion-card>

    <ion-card color="primary">
      <ion-card-header>
        <ion-card-title>Produk terlaris (all time):</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <h2>{{namaProdukTerlaris}}</h2>
      </ion-card-content>
    </ion-card>
  </ion-item>
</ion-content>

<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>

    <ion-title>Products</ion-title>

    <ion-buttons slot="end">
      <ion-button routerLink="/cart">
        <ion-icon slot="icon-only" name="cart-outline"></ion-icon>
        <ion-badge color="danger" *ngIf="totalItemCart > 0">{{ totalItemCart }}</ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Search bar -->
  <ion-list lines="full">
    <ion-item>
      <ion-input labelPlacement="floating" (keyup)="searchProducts()" label="Cari produk:"
        [(ngModel)]="keywordSearch"></ion-input>
    </ion-item>
  </ion-list>

  <!-- Result bar -->
  <ion-accordion-group expand="inset" *ngFor="let p of productList">
    <ion-accordion value="first">
      <ion-item slot="header" color="primary">
        <ion-label>{{ p.name }}</ion-label>
      </ion-item>
      <div class="ion-padding" slot="content">
        <ion-list>
          <ion-item>
            <ion-img [src]="p.url ? p.url : 'https://katalog.nurasouvenir.com/assets/images/product-placeholder.png'" style="height: 360px;"></ion-img>
          </ion-item>
          <ion-item>
            {{ p.description }}
          </ion-item>
          <ion-item>
            Harga Jual: {{ p.sale_price }}
          </ion-item>
          <ion-item>
            Stok: {{ p.stock }}
          </ion-item>

          <ion-button routerLink="details/{{p.id_product}}">See Details</ion-button>
          <ion-button color="secondary" fill="outline" routerLink="form/{{p.id_product}}">Edit</ion-button>
          <ion-button color="danger" [disabled]="p.stock <= 0" (click)="addToCart(p)">
            {{ p.stock <= 0 ? 'Stok Habis' : 'Add to Cart' }}
          </ion-button>
        </ion-list>
      </div>
    </ion-accordion>
  </ion-accordion-group>

  <!-- FAB Tambah Produk -->
  <ion-fab id="fabAdd" slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button routerLink="/products/form">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
